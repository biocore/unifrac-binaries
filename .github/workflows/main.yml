name: unifrac-binaries CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]



# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, linux-gpu-cuda, ubuntu-24.04-arm]
        offload: [cpu, acc, ompgpu]
        exclude:
          - os: linux-gpu-cuda
            offload: cpu
          - os: macos-15
            offload: acc
          - os: macos-15
            offload: ompgpu
          - os: macos-15-intel
            offload: acc
          - os: macos-15-intel
            offload: ompgpu
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
    - name: Install 
      shell: bash -l {0}
      run: |
        df -h .
        cplatform=`conda info |awk '/platform/{print $3}'`
        echo "Conda platform: ${cplatform}"
        if [[ "$(uname -s)" == "Linux" ]];
        then
          conda create -q --yes --strict-channel-priority -n unifrac -c conda-forge gxx_${cplatform} hdf5 lz4 zlib hdf5-static scikit-bio-binaries make curl
        else
          conda create -q --yes --strict-channel-priority -n unifrac -c conda-forge clangxx_${cplatform} hdf5 lz4 hdf5-static scikit-bio-binaries make curl
        fi 
        conda clean --yes -t
        df -h .
        conda activate unifrac
        echo "$(uname -s)"
        which $CC
        $CC -v
        $CXX -v
        which h5c++
        export PERFORMING_CONDA_BUILD=True
        export BUILD_NV_OFFLOAD=${{ matrix.offload }}
        if [[ "$(uname -s)" == "Linux" ]] && [[ "x${BUILD_NV_OFFLOAD}" != "xcpu" ]];
        then
          # install PGI locally
          ./scripts/install_hpc_sdk.sh </dev/null
          if [[ "x${cplatform}" == "xlinux-64" ]]; then
            # also install the AMD compiler
            ./scripts/install_amd_clang.sh </dev/null
          fi
          # get the compilers in the path and set NV_CXX and AMD_CXX
          . ./setup_nv_compiler.sh
          if [[ "x${cplatform}" == "xlinux-64" ]]; then
            . ./setup_amd_compiler.sh
          fi
        fi
        # else, no NV_CXX or AMD_CXX in the env, so no GPU build
        df -h .
        echo "======= begin env ====="
        env
        echo "=======  end env  ====="
        # all == build (shlib,bins,tests) and install
        make clean && make clean_install && make all
        df -h .
    - name: Tests
      shell: bash -l {0}
      run: |
        conda activate unifrac
        if [[ "$(uname -s)" == "Linux" ]];
        then
           lscpu
        fi
        # keep it low for runs in containers
        # and a weird number to potentially catch potential bugs
        export OMP_NUM_THREADS=3
        # diagnostic messages for debugging, if needed
        export UNIFRAC_CPU_INFO=Y
        export UNIFRAC_GPU_INFO=Y
        pushd src
        ./test_su
        ./test_api
        ./test_ska
        ./test_su_api
        popd
        pushd test
        ./capi_test 1
        ./capi_inmem_test 1
        # explicitly check that we do not have hdf5 dependencies
        if [[ "$(uname -s)" == "Linux" ]];
        then
          ldd ./capi_test |awk 'BEGIN{a=0}/hdf/{a=a+1;print $0}END{if (a==0) {print "No dynamic hdf5 found"} else {exit 2}}'
        else
          otool -L ./capi_test|awk 'BEGIN{a=0}/hdf/{a=a+1;print $0}END{if (a==0) {print "No dynamic hdf5 found"} else {exit 2}}'
        fi
        popd
        pushd src/testdata
        conda install --yes -c conda-forge h5py python=3.11
        ./validation_tests.sh 
        popd
        # finally, test rapi, too
        pushd src
        if [[ "$(uname -s)" == "Linux" ]]; 
        then
          make clean
          rm -f ~/.R/Makevars
          conda install -q --yes  --strict-channel-priority -c conda-forge r-base
          unset CXXFLAGS
          unset CFLAGS
          unset DEBUG_CXXFLAGS
          unset DEBUG_CFLAGS
          # the r-base package has a broken dependency
          ln -s $CONDA_PREFIX/lib/libreadline.so $CONDA_PREFIX/lib/libreadline.so.6
          R -e 'install.packages("Rcpp", repos="http://lib.stat.cmu.edu/R/CRAN/")'
          make rapi_test
        fi
        popd
    - name: Sanity checks
      shell: bash -l {0}
      run: |
        conda activate unifrac
        # keep it low for runs in containers
        export OMP_NUM_THREADS=2
        pushd ci
        ./crawford_test.sh
        popd

  # ----------------------------------------------------------------------
  # Native in-memory static-archive job. Builds libssu_inmem.a -- the
  # artifact downstream embedders link (see src/inmem_build.mk) -- and runs
  # the concurrency suite against it.
  #
  # Nothing else in CI builds this archive, and it is a configuration all its
  # own: UNIFRAC_WASM is defined, so no SIGUSR1 handler is installed and
  # CPU_SETSIZE takes its fallback value, yet unlike the WASM build it is
  # genuinely multi-threaded. The suite in src/test_su.cpp covers the same
  # entry points, but only as compiled for libssu.so.
  #
  # skbb comes from conda-forge, headers and library from the same package,
  # so this job needs no second checkout.
  #
  # Note for anyone adding a TSan gate later: TSan reports ~145 warnings
  # against uninstrumented libgomp with a *single* caller thread at
  # OMP_NUM_THREADS=4, and zero at 1 -- they are present in today's serial
  # usage too. ASan plus concurrent computes is what caught the real bug.
  build-and-test-inmem:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
    - name: Install
      shell: bash -l {0}
      run: |
        cplatform=`conda info |awk '/platform/{print $3}'`
        echo "Conda platform: ${cplatform}"
        conda create -q --yes --strict-channel-priority -n unifrac-inmem \
              -c conda-forge gxx_${cplatform} scikit-bio-binaries make
        conda clean --yes -t
    - name: Build archive
      shell: bash -l {0}
      run: |
        conda activate unifrac-inmem
        $CXX -v
        pushd src
        make inmem_static INMEM_SKBB_EXTERN=$CONDA_PREFIX/include/scikit-bio-binaries
        # the archive must actually export what embedders call, including the
        # seeded v4 entries -- a dropped TU would otherwise surface downstream
        for sym in one_off_matrix_inmem_fp32_v3 one_off_matrix_inmem_fp32_v4 \
                   one_off_matrix_inmem_v3 one_off_matrix_inmem_v4 faith_pd_inmem; do
          nm -g --defined-only libssu_inmem.a | grep -q " T ${sym}$" \
            || { echo "MISSING SYMBOL: ${sym}"; exit 2; }
        done
        popd
    - name: Concurrency tests
      shell: bash -l {0}
      run: |
        conda activate unifrac-inmem
        # keep it low for runs in containers, and a weird number to
        # potentially catch potential bugs
        export OMP_NUM_THREADS=3
        pushd src
        make inmem_test INMEM_SKBB_EXTERN=$CONDA_PREFIX/include/scikit-bio-binaries
        make inmem_test_asan INMEM_SKBB_EXTERN=$CONDA_PREFIX/include/scikit-bio-binaries
        popd

  # ----------------------------------------------------------------------
  # WebAssembly build job. Single-threaded, CPU-only. Produces
  # libssu_wasm.a and runs the WASM-side test suite under node, plus the
  # public C API symmetry test (test/capi_inmem_test.c). Depends on a
  # sibling scikit-bio-binaries checkout pinned to the upstream commit
  # that added skbb's WASM build.
  build-and-test-wasm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout unifrac-binaries
      uses: actions/checkout@v4
      with:
        path: unifrac-binaries
    # Pin to the merge commit of scikit-bio/scikit-bio-binaries#12
    # ("Wasm 260424"), which is the first upstream main commit that
    # ships libskbb_wasm.a. Bump deliberately if we need newer skbb.
    - name: Checkout scikit-bio-binaries
      uses: actions/checkout@v4
      with:
        repository: scikit-bio/scikit-bio-binaries
        ref: bed8f41002388608c5eeb57d8858dfc76df96ed9
        path: scikit-bio-binaries
    - name: Set up emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.71
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    # The wasm_regen_*_expected targets are developer-only and run
    # outside CI; the expected-value headers under
    # src/tests/wasm/expected/ are committed and consumed as-is.
    # No native build deps required for the WASM build path itself —
    # libskbb_wasm.a is Eigen-only.
    - name: Build skbb WASM
      working-directory: scikit-bio-binaries
      run: make wasm
    - name: Build unifrac-binaries WASM
      working-directory: unifrac-binaries
      run: make wasm SKBB_DIR=$GITHUB_WORKSPACE/scikit-bio-binaries
    - name: Run WASM tests under node
      working-directory: unifrac-binaries
      run: make wasm_test SKBB_DIR=$GITHUB_WORKSPACE/scikit-bio-binaries
    - name: Sanity check artifact
      working-directory: unifrac-binaries
      run: |
        ls -la src/libssu_wasm.a
        emar t src/libssu_wasm.a | head -20
